<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WikiPop</title>
<meta name="description" content="Devine quel article Wikipédia a été le plus consulté cette semaine. Un duel rapide et gratuit, basé sur les vraies statistiques de Wikipédia.">
<meta property="og:type" content="website">
<meta property="og:title" content="WikiPop — Devine l'article Wikipédia le plus consulté">
<meta property="og:description" content="Duel de pages Wikipédia : laquelle a le plus de vues cette semaine ?">
<meta property="og:url" content="https://kevinraphael95.github.io/wikipop/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23c8f135'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%230a0a0a' stroke-width='1.6'/%3E%3Cpath d='M8 3c0 0-2.5 2.5-2.5 5s2.5 5 2.5 5' fill='none' stroke='%230a0a0a' stroke-width='1.2'/%3E%3Cpath d='M8 3c0 0 2.5 2.5 2.5 5s-2.5 5-2.5 5' fill='none' stroke='%230a0a0a' stroke-width='1.2'/%3E%3Cline x1='3' y1='8' x2='13' y2='8' stroke='%230a0a0a' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <header class="hdr">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="#0a0a0a" stroke-width="1.8"/>
          <path d="M8 2C8 2 5 5 5 8s3 6 3 6" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M8 2C8 2 11 5 11 8s-3 6-3 6" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2.5" y1="8" x2="13.5" y2="8" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="3" y1="5.5" x2="13" y2="5.5" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="3" y1="10.5" x2="13" y2="10.5" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-name">WikiPop</span>
    </div>

    <div class="hdr-right">
      <div class="chip" aria-label="Meilleur streak">
        <span class="chip-lbl">Best</span>
        <span id="best">0</span>
      </div>
      <div class="chip chip-streak" id="streak-chip" aria-label="Streak actuel">
        <span class="streak-icon" aria-hidden="true">🔥</span>
        <span id="streak">0</span>
      </div>
      <button class="tbtn" id="toggle-btn" aria-label="Changer de thème"></button>
    </div>
  </header>

  <div class="question-bar">
    <p class="q-text">Laquelle de ces pages Wikipédia a été la <strong>plus consultée</strong> ces 7 derniers jours ?</p>
  </div>

  <div class="prog-row">
    <div class="prog-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Pourcentage de bonnes réponses">
      <div class="prog-bar" id="prog-bar"></div>
    </div>
    <span class="prog-pct" id="prog-pct">0%</span>
  </div>

  <main class="duel" id="duel">
    <div class="side-wrap">
      <button class="side" id="side-A" aria-label="Choisir l'article A">
        <div class="side-img">
          <div class="img-shimmer" id="shimA" aria-hidden="true"></div>
          <img id="imgel-A" src="" alt="" style="display:none">
          <div class="no-img" id="ph-A" style="display:none" aria-hidden="true">📄</div>
        </div>
        <div class="choose-hint" aria-hidden="true">Choisir</div>
        <div class="ribbon" aria-hidden="true">✓ Gagnant</div>
        <div class="side-footer">
          <div class="side-info">
            <div class="side-title" id="title-A">—</div>
          </div>
          <div class="views-block" aria-live="polite">
            <div class="views-num" id="num-A">???</div>
            <div class="views-sub">vues</div>
          </div>
        </div>
      </button>
      <a class="wiki-link" id="wiki-A" href="#" target="_blank" rel="noopener noreferrer" aria-label="Voir l'article sur Wikipédia">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Wikipédia</span>
      </a>
    </div>

    <div class="vs-col" aria-hidden="true"><span class="vs-badge">VS</span></div>

    <div class="side-wrap">
      <button class="side" id="side-B" aria-label="Choisir l'article B">
        <div class="side-img">
          <div class="img-shimmer" id="shimB" aria-hidden="true"></div>
          <img id="imgel-B" src="" alt="" style="display:none">
          <div class="no-img" id="ph-B" style="display:none" aria-hidden="true">📄</div>
        </div>
        <div class="choose-hint" aria-hidden="true">Choisir</div>
        <div class="ribbon" aria-hidden="true">✓ Gagnant</div>
        <div class="side-footer">
          <div class="side-info">
            <div class="side-title" id="title-B">—</div>
          </div>
          <div class="views-block" aria-live="polite">
            <div class="views-num" id="num-B">???</div>
            <div class="views-sub">vues</div>
          </div>
        </div>
      </button>
      <a class="wiki-link" id="wiki-B" href="#" target="_blank" rel="noopener noreferrer" aria-label="Voir l'article sur Wikipédia">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Wikipédia</span>
      </a>
    </div>
  </main>

  <div class="bottom">
    <div class="feedback loading" id="feedback" role="status" aria-live="polite">Chargement…</div>
    <button class="btn-next" id="btn-next" aria-label="Question suivante">
      Suivant
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <footer class="foot">
    Données&nbsp;·&nbsp;<a href="https://fr.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipédia fr</a>
    <span aria-hidden="true"> · </span>
    <a href="https://wikimedia.org/api/rest_v1/" target="_blank" rel="noopener noreferrer">API Wikimédia</a>
  </footer>

</div>
<script src="script.js"></script>
<script src="theme.js"></script>
</body>
</html>
