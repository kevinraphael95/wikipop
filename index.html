<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WikiPop</title>
  <meta name="description" content="Devine quel article Wikipédia a été le plus consulté cette semaine. Un duel rapide et gratuit, basé sur les vraies statistiques de Wikipédia." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WikiPop — Devine l'article Wikipédia le plus consulté" />
  <meta property="og:description" content="Duel de pages Wikipédia : laquelle a le plus de vues cette semaine ?" />
  <meta property="og:url" content="https://kevinraphael95.github.io/wikipop/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232748c9'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23fff'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Applique le thème avant le premier rendu (évite le flash blanc) -->
  <script>
    try {
      const t = JSON.parse(localStorage.getItem('wikipop-state'))?.theme
        ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="brand__mark" aria-hidden="true">W</span>WikiPop</div>
    <div class="top__right">
      <div class="stats" role="group" aria-label="Statistiques">
        <div class="stat" id="stat-streak"><span class="stat__v" id="s-streak">0</span><span class="stat__l">Série</span></div>
        <div class="stat"><span class="stat__v" id="s-best">0</span><span class="stat__l">Record</span></div>
        <div class="stat"><span class="stat__v" id="s-acc">–</span><span class="stat__l">Réussite</span></div>
      </div>
      <button class="icon-btn" id="theme" type="button" aria-label="Changer de thème"></button>
    </div>
  </header>

  <section class="ask">
    <h1>Quelle page a été la <em>plus consultée</em> ces 7 derniers jours ?</h1>
  </section>

  <main class="duel" id="duel" aria-busy="true"></main>

  <div class="actions">
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <span class="feedback__ic" id="fb-ic" aria-hidden="true">…</span>
      <span id="fb-text">Chargement…</span>
    </div>
    <button class="btn" id="next" type="button" disabled>Suivant <kbd aria-hidden="true">Entrée</kbd></button>
  </div>

  <footer class="foot">
    Données : <a href="https://fr.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipédia fr</a>
    · <a href="https://wikimedia.org/api/rest_v1/" target="_blank" rel="noopener noreferrer">API Wikimédia</a>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
